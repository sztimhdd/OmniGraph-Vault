# Wave 3 T9 cutover 2026-06-02 — switch ingest to Qdrant vector storage (#25 close path)
# LightRAG 1.4.16 mandates QDRANT_URL when vector_storage="QdrantVectorDBStorage"
[Service]
Environment="OMNIGRAPH_VECTOR_STORAGE=qdrant"
Environment="QDRANT_URL=http://127.0.0.1:6333"

# Scheduler contract (2026-08-13 repair):
# - omnigraph-daily-ingest.timer is the SOLE recurring ingest scheduler (OnCalendar 00/2 UTC).
#   afternoon/evening ingest timers are disabled on production — do not re-enable them.
# - The app stops itself cooperatively at --batch-timeout 6300 (105 min); that is the
#   normal budget. Restart=no, so a later timer fire is the only retry mechanism.
# - RuntimeMaxSec=14400 (4h) is an EMERGENCY safety wall only, intentionally larger than
#   the 2h timer interval. It exists solely to kill a batch whose app/provider cleanup
#   truly cannot finish; it must NOT be the normal scheduling mechanism.
# - TimeoutStopSec=300 = on stop (timer re-fire / Conflicts= SIGTERM), escalate to
#   SIGKILL after 5min if Python doesn't exit.
TimeoutStopSec=300
RuntimeMaxSec=14400
